<div class="rings">
  <div class="gauge gauge--cpu" data-gauge="cpu">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 88 88" aria-hidden="true">
        <defs>
          <linearGradient id="g-cpu" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--gauge-color)" />
            <stop offset="1" stop-color="color-mix(in srgb, var(--gauge-color) 55%, white)" />
          </linearGradient>
        </defs>
        <circle class="gauge__track" cx="44" cy="44" r="36" stroke-width="7" />
        <circle
          class="gauge__value"
          cx="44"
          cy="44"
          r="36"
          stroke-width="7"
          pathLength="100"
          data-sill-meter="cpu.usage"
          data-value="cpu"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" data-sill-text="cpu.usage">—</span><span class="gauge__pct">%</span>
      </span>
    </div>
    <span class="gauge__label">CPU</span>
  </div>

  <div class="gauge gauge--gpu" data-gauge="gpu">

      <svg class="gauge__svg" viewBox="0 0 88 88" aria-hidden="true">

        <circle
          class="gauge__value"
          cx="44"
          cy="44"
          r="36"
          stroke-width="7"
          pathLength="100"
          data-sill-meter="gpu.usage"
          data-value="gpu"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" data-sill-text="gpu.usage">—</span><span class="gauge__pct">%</span>
      </span>
    </div>
    <span class="gauge__label">GPU</span>
  </div>

  <div class="gauge gauge--ram" data-gauge="ram">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 88 88" aria-hidden="true">
        <defs>
          <linearGradient id="g-ram" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--gauge-color)" />
            <stop offset="1" stop-color="color-mix(in srgb, var(--gauge-color) 55%, white)" />
          </linearGradient>

        <circle

          stroke-width="7"
          pathLength="100"

          data-value="mem"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" data-sill-text="mem.percent">—</span><span class="gauge__pct">%</span>
      </span>
    </div>
    <span class="gauge__label">RAM</span>
  </div>

  <div class="gauge gauge--swap" data-gauge="swap">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 88 88" aria-hidden="true">
        <defs>
          <linearGradient id="g-swap" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--gauge-color)" />
            <stop offset="1" stop-color="color-mix(in srgb, var(--gauge-color) 55%, white)" />
          </linearGradient>
        </defs>
        <circle class="gauge__track" cx="44" cy="44" r="36" stroke-width="7" />

    </div>

    <span class="gauge__meta" id="swapMeta"></span>
  </div>
</div>
