<div class="rings" id="rings">
  <div class="gauge gauge--cpu" id="gaugeCpu" role="group">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="gauge__track" cx="50" cy="50" r="43" />
        <circle
          class="gauge__arc"
          cx="50"
          cy="50"
          r="43"
          pathLength="100"
          data-sill-meter="cpu.usage"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" id="numCpu">—</span><span class="gauge__pct" id="pctCpu" hidden>%</span>
      </span>
    </div>
    <span class="gauge__label">CPU</span>
    <span class="gauge__sub" id="subCpu">—</span>
  </div>

  <div class="gauge gauge--gpu" id="gaugeGpu" role="group">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="gauge__track" cx="50" cy="50" r="43" />
        <circle
          class="gauge__arc"
          cx="50"
          cy="50"
          r="43"
          pathLength="100"
          data-sill-meter="gpu.usage"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" id="numGpu">—</span><span class="gauge__pct" id="pctGpu" hidden>%</span>
      </span>
    </div>
    <span class="gauge__label">GPU</span>
    <span class="gauge__sub" id="subGpu">—</span>
  </div>

  <div class="gauge gauge--ram" id="gaugeRam" role="group">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="gauge__track" cx="50" cy="50" r="43" />
        <circle
          class="gauge__arc"
          cx="50"
          cy="50"
          r="43"
          pathLength="100"
          data-sill-meter="mem.percent"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" id="numRam">—</span><span class="gauge__pct" id="pctRam" hidden>%</span>
      </span>
    </div>
    <span class="gauge__label">RAM</span>
    <span class="gauge__sub" id="subRam">—</span>
  </div>

  <div class="gauge gauge--swap" id="gaugeSwap" role="group">
    <div class="gauge__dial">
      <svg class="gauge__svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="gauge__track" cx="50" cy="50" r="43" />
        <circle
          class="gauge__arc"
          cx="50"
          cy="50"
          r="43"
          pathLength="100"
          data-sill-meter="swap.percent"
        />
      </svg>
      <span class="gauge__center">
        <span class="gauge__num" id="numSwap">—</span><span class="gauge__pct" id="pctSwap" hidden>%</span>
      </span>
    </div>
    <span class="gauge__label">SWAP</span>
    <span class="gauge__sub" id="subSwap">—</span>
  </div>

  <span class="sill-i18n" id="noDataLabel" data-sill-i18n="noData" hidden>无数据</span>
</div>
