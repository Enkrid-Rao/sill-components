<div class="media">
  <div class="media__title" data-sill-text="media.title">—</div>
  <div class="media__artist" data-sill-text="media.artist">—</div>
  <div class="media__empty" data-sill-if="!media.active" data-sill-i18n="empty">Not playing</div>
  <div class="media__bar"><div class="media__fill" data-sill-meter="media.progress"></div></div>
  <div class="media__controls">
    <button class="media__button" type="button" data-sill-action="media.prev">‹</button>
    <button class="media__button" type="button" data-sill-action="media.playpause">▶</button>
    <button class="media__button" type="button" data-sill-action="media.next">›</button>
  </div>
</div>
