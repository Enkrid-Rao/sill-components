<div class="rings">
  <div class="rings__head">
    <span class="rings__title" data-sill-i18n="title">SYSTEM</span>
    <span class="rings__cores">
      <span data-sill-text="cpu.cores">—</span>
      <span data-sill-i18n="cores">cores</span>
    </span>
  </div>

  <div class="rings__row">
    <div class="ring">
      <div class="ring__dial">
        <svg viewBox="0 0 72 72" class="ring__svg" aria-hidden="true">
          <circle class="ring__track" cx="36" cy="36" r="30" pathLength="100" />
          <circle
            class="ring__value"
            cx="36"
            cy="36"
            r="30"
            pathLength="100"
            data-sill-meter="cpu.usage"
          />
        </svg>
        <span class="ring__num" data-sill-text="cpu.usage">—</span>
      </div>
      <span class="ring__label" data-sill-i18n="cpu">CPU</span>
    </div>

    <div class="ring ring--warm">
      <div class="ring__dial">
        <svg viewBox="0 0 72 72" class="ring__svg" aria-hidden="true">
          <circle class="ring__track" cx="36" cy="36" r="30" pathLength="100" />
          <circle
            class="ring__value"
            cx="36"
            cy="36"
            r="30"
            pathLength="100"
            data-sill-meter="mem.percent"
          />
        </svg>
        <span class="ring__num" data-sill-text="mem.percent">—</span>
      </div>
      <span class="ring__label" data-sill-i18n="mem">MEM</span>
    </div>

    <div class="ring ring--pale">
      <div class="ring__dial">
        <svg viewBox="0 0 72 72" class="ring__svg" aria-hidden="true">
          <circle class="ring__track" cx="36" cy="36" r="30" pathLength="100" />
          <circle
            class="ring__value"
            cx="36"
            cy="36"
            r="30"
            pathLength="100"
            data-sill-meter="gpu.usage"
          />
        </svg>
        <span class="ring__num" data-sill-text="gpu.usage">—</span>
      </div>
      <span class="ring__label" data-sill-i18n="gpu">GPU</span>
    </div>
  </div>
</div>
