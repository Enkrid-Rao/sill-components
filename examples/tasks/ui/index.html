<div class="tasks">
  <div class="tasks__head">
    
    <button class="tasks__mode" id="mode" type="button">compact</button>
  </div>

  <div class="tasks__meter">
    <div class="tasks__fill" id="fill"></div>
  </div>
  <div class="tasks__count" id="count">0 / 0</div>

  <div class="tasks__list">
    <div class="task" data-sill-repeat="state.todos">
      <button
        class="task__check"
        type="button"
        data-sill-action="todo.toggle"
        data-sill-action-arg="item.id"
        aria-label="toggle"
      ></button>
      <span class="task__text" data-sill-text="item.text"></span>
    </div>
  </div>

  <div class="tasks__empty" data-sill-if="!state.todos.length" data-sill-i18n="empty">All clear</div>
</div>
